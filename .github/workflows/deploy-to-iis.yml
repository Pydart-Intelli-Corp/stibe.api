name: Deploy to Remote IIS Website

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: 

env:
  DOTNET_VERSION: '8.0.x'
  REMOTE_SERVER: '202.164.153.160'
  REMOTE_PORT: '85'
  FTP_PORT: '92'
  API_HEALTH_ENDPOINT: '/api/test/health'
  PUBLISH_OUTPUT: './publish'
  BUILD_CONFIGURATION: 'Release'
  
jobs:
  deploy:
    runs-on: ubuntu-latest  # Use GitHub hosted runners
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Validate project structure
      run: |
        echo "🔍 Validating project structure..."
        
        if [ -f "stibe.api.csproj" ]; then
          echo "✅ Project file found: stibe.api.csproj"
        else
          echo "❌ ERROR: Project file not found!"
          exit 1
        fi
        
        if [ -f "web.config" ]; then
          echo "✅ IIS configuration found: web.config"
        else
          echo "⚠️ WARNING: web.config not found in source"
        fi
        
        if [ -f "Program.cs" ]; then
          echo "✅ Main program file found: Program.cs"
        else
          echo "❌ ERROR: Program.cs not found!"
          exit 1
        fi
        
        echo "📁 Project structure validation completed"
        
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Restore dependencies
      run: |
        echo "🔄 Restoring NuGet packages..."
        dotnet restore stibe.api.csproj --verbosity normal
      
    - name: Build application
      run: |
        echo "🔨 Building application in ${{ env.BUILD_CONFIGURATION }} mode..."
        dotnet build stibe.api.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal
      
    - name: Run tests (if any)
      run: |
        echo "🧪 Running tests..."
        dotnet test stibe.api.csproj --no-restore --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal --logger trx --results-directory "TestResults"
      continue-on-error: true
      
    - name: Install Entity Framework Tools
      run: |
        echo "🔧 Installing Entity Framework CLI tools..."
        dotnet tool install --global dotnet-ef --version 8.0.8 || dotnet tool update --global dotnet-ef --version 8.0.8 || echo "EF tools installation failed, trying alternative..."
        
        # Alternative installation method if global install fails
        if ! command -v dotnet-ef &> /dev/null; then
          echo "🔄 Trying local tool installation..."
          dotnet new tool-manifest --force || echo "Tool manifest already exists"
          dotnet tool install dotnet-ef --version 8.0.8 || echo "Local tool installation failed"
        fi
        
        echo "✅ EF Tools installation completed"
        dotnet ef --version || echo "EF tools not available - continuing without migrations"
      
    - name: Update database with migrations
      run: |
        echo "🗄️ Updating database with latest migrations..."
        
        # Check if EF tools are available
        if command -v dotnet-ef &> /dev/null; then
          echo "✅ EF tools are available"
          
          if [ -n "$DATABASE_CONNECTION_STRING" ]; then
            echo "Database connection string provided, running migrations..."
            echo "🔍 Checking for migrations..."
            
            # Try to list migrations first
            if dotnet ef migrations list --project stibe.api.csproj --verbose 2>/dev/null; then
              echo "🚀 Running database update..."
              if dotnet ef database update --verbose --connection "$DATABASE_CONNECTION_STRING" --project stibe.api.csproj; then
                echo "MIGRATION_STATUS=✅ COMPLETED" >> $GITHUB_ENV
                echo "MIGRATION_MESSAGE=Database updated with latest migrations successfully" >> $GITHUB_ENV
              else
                echo "MIGRATION_STATUS=⚠️ FAILED" >> $GITHUB_ENV
                echo "MIGRATION_MESSAGE=Database migration failed but deployment will continue" >> $GITHUB_ENV
              fi
            else
              echo "MIGRATION_STATUS=⚠️ SKIPPED" >> $GITHUB_ENV
              echo "MIGRATION_MESSAGE=Could not list migrations - skipping database update" >> $GITHUB_ENV
            fi
          else
            echo "No database connection string provided, skipping migrations."
            echo "MIGRATION_STATUS=⏭️ SKIPPED" >> $GITHUB_ENV
            echo "MIGRATION_MESSAGE=Manual migration required - no connection string provided" >> $GITHUB_ENV
          fi
        else
          echo "❌ EF tools not available, skipping migrations"
          echo "MIGRATION_STATUS=⏭️ SKIPPED" >> $GITHUB_ENV
          echo "MIGRATION_MESSAGE=EF tools not available - manual migration required" >> $GITHUB_ENV
        fi
        
        echo "You can run migrations manually on the server with:"
        echo "dotnet ef database update --project stibe.api.csproj"
      env:
        DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
      continue-on-error: true
      
    - name: Publish application
      run: |
        echo "📦 Publishing application for deployment (Visual Studio style)..."
        
        # Clean any previous publish folder
        if [ -d "${{ env.PUBLISH_OUTPUT }}" ]; then
          echo "🧹 Cleaning previous publish folder..."
          rm -rf "${{ env.PUBLISH_OUTPUT }}"
        fi
        
        # Create fresh publish directory
        mkdir -p "${{ env.PUBLISH_OUTPUT }}"
        
        # Create uploads directory structure in publish folder
        echo "📁 Creating uploads directory structure..."
        mkdir -p "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/profile-images"
        mkdir -p "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/service-images"
        mkdir -p "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/shop-images" 
        mkdir -p "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/product-images"
        
        # Create test files to ensure directories exist and test static file serving
        echo "Test file for profile images" > "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/profile-images/test.txt"
        echo "Test file for service images" > "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/service-images/test.txt"
        echo "Test file for shop images" > "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/shop-images/test.txt"
        echo "Test file for product images" > "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/product-images/test.txt"
        
        # Create a sample image placeholder for testing static file serving
        echo "Sample test image content" > "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/profile-images/test-deployment.jpg"
        echo "This is a test file to verify static file serving is working properly after deployment." > "${{ env.PUBLISH_OUTPUT }}/wwwroot/uploads/test-static-files.txt"
        
        # Publish with same settings as Visual Studio
        echo "🔨 Publishing with Visual Studio-like settings..."
        dotnet publish stibe.api.csproj \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --output "${{ env.PUBLISH_OUTPUT }}" \
          --no-restore \
          --no-build \
          --self-contained false \
          --verbosity normal \
          --property:PublishUrl="${{ env.PUBLISH_OUTPUT }}" \
          --property:DeleteExistingFiles=true \
          --property:PublishSingleFile=false \
          --property:PublishReadyToRun=false
        
        echo "📁 Verifying published files..."
        echo "Contents of publish folder:"
        find "${{ env.PUBLISH_OUTPUT }}" -type f | head -20
        
        echo ""
        echo "📊 Publish folder size:"
        du -sh "${{ env.PUBLISH_OUTPUT }}"
        
        echo ""
        echo "🔍 Checking for essential files..."
        
        # Check main DLL
        if [ -f "${{ env.PUBLISH_OUTPUT }}/stibe.api.dll" ]; then
          echo "✅ Main DLL found: stibe.api.dll"
          ls -la "${{ env.PUBLISH_OUTPUT }}/stibe.api.dll"
        else
          echo "❌ ERROR: Main DLL not found!"
          echo "Available DLL files:"
          find "${{ env.PUBLISH_OUTPUT }}" -name "*.dll" | head -10
          exit 1
        fi
        
        # Check web.config
        if [ -f "${{ env.PUBLISH_OUTPUT }}/web.config" ]; then
          echo "✅ IIS configuration found: web.config"
          ls -la "${{ env.PUBLISH_OUTPUT }}/web.config"
        else
          echo "⚠️ WARNING: web.config not found - IIS may not start properly"
          echo "Creating basic web.config..."
          cat > "${{ env.PUBLISH_OUTPUT }}/web.config" << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <location path="." inheritInChildApplications="false">
            <system.webServer>
              <handlers>
                <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
              </handlers>
              <aspNetCore processPath="dotnet" arguments=".\stibe.api.dll" stdoutLogEnabled="true" stdoutLogFile=".\logs\stdout" hostingModel="inprocess">
                <environmentVariables>
                  <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                </environmentVariables>
              </aspNetCore>
            </system.webServer>
          </location>
        </configuration>
        EOF
          echo "✅ Basic web.config created"
        fi
        
        # Check appsettings
        if [ -f "${{ env.PUBLISH_OUTPUT }}/appsettings.json" ]; then
          echo "✅ App settings found: appsettings.json"
          ls -la "${{ env.PUBLISH_OUTPUT }}/appsettings.json"
        else
          echo "⚠️ WARNING: appsettings.json not found"
        fi
        
        # Check runtime files
        runtime_files=$(find "${{ env.PUBLISH_OUTPUT }}" -name "*.dll" | wc -l)
        echo "📦 Total DLL files: $runtime_files"
        
        if [ $runtime_files -lt 10 ]; then
          echo "⚠️ WARNING: Very few DLL files found - dependencies might be missing"
        else
          echo "✅ Good number of dependency files found"
        fi
        
        echo ""
        echo "🎯 Publish Summary:"
        echo "=================="
        echo "📁 Publish folder: ${{ env.PUBLISH_OUTPUT }}"
        echo "📦 Configuration: ${{ env.BUILD_CONFIGURATION }}"
        echo "🔧 Self-contained: false (framework-dependent)"
        echo "✅ Ready for deployment to IIS"
        
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deployment-package-${{ github.run_number }}
        path: ${{ env.PUBLISH_OUTPUT }}
        retention-days: 7
      
    - name: Create deployment timestamp
      run: echo "DEPLOY_TIME=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
      
    - name: Backup current server files (Clean Deployment)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      continue-on-error: true
      with:
        server: ${{ env.REMOTE_SERVER }}
        port: ${{ env.FTP_PORT }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./temp-backup/
        server-dir: /test/
        protocol: ftp
        state-name: .ftp-backup-sync-state.json
        dry-run: true
        log-level: verbose
      env:
        FTP_BACKUP_ACTION: "download"
        
    - name: Clean deployment to IIS Website via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ env.REMOTE_SERVER }}
        port: ${{ env.FTP_PORT }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ env.PUBLISH_OUTPUT }}/
        server-dir: /test/
        protocol: ftp
        state-name: .ftp-deploy-sync-state.json
        dry-run: false
        log-level: verbose
        # CLEAN DEPLOYMENT - Remove all existing files first
        dangerous-clean-slate: true
        # Exclude only essential system files from deletion
        exclude: |
          **/.well-known/**
          **/logs/**
          **/*.log
          **/web.config.backup
        # Include all published files
        include: |
          **/*
        
    - name: Wait for IIS to restart and initialize
      run: |
        echo "⏳ Waiting for IIS application to restart and initialize..."
        echo "This allows time for:"
        echo "  - Application pool to recycle"
        echo "  - .NET runtime to initialize"
        echo "  - Dependencies to load"
        sleep 45
    - name: Wait for clean deployment to complete
      run: |
        echo "⏳ Waiting for clean deployment to complete..."
        echo "This allows time for:"
        echo "  - Old files to be removed completely"
        echo "  - New files to be uploaded"
        echo "  - Application pool to detect changes"
        echo "  - .NET runtime to initialize with new files"
        sleep 60
        
    - name: Verify clean deployment
      run: |
        echo "🔍 Verifying clean deployment completed successfully..."
        echo ""
        echo "✅ Clean deployment process:"
        echo "  1. ✅ Built application in ${{ env.BUILD_CONFIGURATION }} mode"
        echo "  2. ✅ Published to local folder: ${{ env.PUBLISH_OUTPUT }}"
        echo "  3. ✅ Removed all existing files from server"
        echo "  4. ✅ Uploaded fresh published files"
        echo "  5. ⏳ Waiting for IIS to recognize changes..."
        echo ""
        echo "🎯 Deployment Details:"
        echo "====================="
        echo "📦 Published Files: Framework-dependent .NET 8.0"
        echo "🗂️ Server Path: C:\\inetpub\\wwwroot\\test\\"
        echo "🔄 Deployment Type: CLEAN (complete file replacement)"
        echo "⏰ Deploy Time: ${DEPLOY_TIME:-$(date +'%Y%m%d_%H%M%S')}"
        echo ""
        
        # Give additional time for IIS to fully initialize
        echo "⏳ Final initialization wait..."
        sleep 30
        
    - name: Comprehensive API Endpoint Testing
      run: |
        echo "🔍 Testing All API Endpoints After Deployment"
        echo "=============================================="
        echo "Server: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
        echo ""
        
        # Base URL for testing
        BASE_URL="http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
        
        # Function to test endpoint with detailed response
        test_api_endpoint() {
          local method="$1"
          local endpoint="$2"
          local description="$3"
          local expected_auth="$4"  # "public", "auth", "admin", etc.
          
          echo "🔗 Testing: $description"
          echo "   Method: $method"
          echo "   URL: $BASE_URL$endpoint"
          
          # Make the request and capture both status and response
          if [ "$method" = "GET" ]; then
            response=$(curl -s -w "\n%{http_code}" "$BASE_URL$endpoint" --connect-timeout 10 --max-time 15 2>/dev/null || echo -e "\nERROR")
          else
            response=$(curl -s -w "\n%{http_code}" -X "$method" "$BASE_URL$endpoint" --connect-timeout 10 --max-time 15 2>/dev/null || echo -e "\nERROR")
          fi
          
          # Extract status code (last line) and body (everything else)
          status_code=$(echo "$response" | tail -1)
          response_body=$(echo "$response" | head -n -1)
          
          # Evaluate response
          if [ "$status_code" = "ERROR" ]; then
            echo "   ❌ Status: Connection Failed"
            echo "   📝 Response: Unable to connect"
          elif [ "$status_code" = "200" ]; then
            echo "   ✅ Status: HTTP $status_code (Success)"
            echo "   📝 Response: $(echo "$response_body" | head -c 100)..."
          elif [ "$status_code" = "401" ] && [ "$expected_auth" != "public" ]; then
            echo "   ✅ Status: HTTP $status_code (Unauthorized - Expected for protected endpoint)"
            echo "   📝 Response: Authentication required"
          elif [ "$status_code" = "404" ]; then
            echo "   ⚠️  Status: HTTP $status_code (Not Found)"
            echo "   📝 Response: Endpoint not found or not deployed"
          elif [ "$status_code" = "500" ]; then
            echo "   ❌ Status: HTTP $status_code (Server Error)"
            echo "   📝 Response: $(echo "$response_body" | head -c 100)..."
          else
            echo "   ⚠️  Status: HTTP $status_code"
            echo "   📝 Response: $(echo "$response_body" | head -c 100)..."
          fi
          echo ""
          
          return $([ "$status_code" = "200" ] || ([ "$status_code" = "401" ] && [ "$expected_auth" != "public" ]))
        }
        
        # Track test results
        total_tests=0
        successful_tests=0
        
        echo "🧪 PUBLIC ENDPOINTS"
        echo "==================="
        
        # Test Controller - Public endpoints
        test_api_endpoint "GET" "/api/test/health" "Health Check Endpoint" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        test_api_endpoint "GET" "/api/test/test-email" "Email Test Endpoint" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        echo "🔐 AUTHENTICATION ENDPOINTS"
        echo "==========================="
        
        # Auth Controller endpoints (corrected paths)
        test_api_endpoint "GET" "/api/auth/check-email-status/test@example.com" "Check Email Status" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        test_api_endpoint "GET" "/api/auth/check-phone-status/1234567890" "Check Phone Status" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        echo "🏪 BUSINESS ENDPOINTS (Public Only)"
        echo "==================================="
        
        # Salon Controller
        test_api_endpoint "GET" "/api/salon" "Get All Salons" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        # OTP Controller
        test_api_endpoint "GET" "/api/otp/status" "OTP Service Status" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        echo "📊 LOGS & MONITORING"
        echo "==================="
        
        # Logs Controller
        test_api_endpoint "GET" "/api/logs/recent?lines=5" "Recent Logs" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        test_api_endpoint "GET" "/api/logs/errors?lines=3" "Recent Errors" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        echo "🔍 IIS DIAGNOSTICS"
        echo "=================="
        
        # Test root application access
        test_api_endpoint "GET" "/" "Root Application" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        # Test if swagger is available
        test_api_endpoint "GET" "/swagger" "Swagger Documentation" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        # Test alternative health endpoint paths
        test_api_endpoint "GET" "/health" "Alternative Health Check" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        # Test uploads directory diagnostic
        test_api_endpoint "GET" "/api/test/uploads-info" "Uploads Directory Info" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        echo "� STATIC FILE SERVING TESTS"
        echo "============================"
        
        # Test static file serving for test files
        test_api_endpoint "GET" "/uploads/test-static-files.txt" "Static File Test (TXT)" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        test_api_endpoint "GET" "/uploads/profile-images/test.txt" "Profile Images Directory Test" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        test_api_endpoint "GET" "/uploads/profile-images/test-deployment.jpg" "Test Image File Serving" "public"
        total_tests=$((total_tests + 1))
        [ $? -eq 0 ] && successful_tests=$((successful_tests + 1))
        
        echo "�📋 ENDPOINT TESTING SUMMARY"
        echo "==========================="
        echo "Total Endpoints Tested: $total_tests"
        echo "Successful Responses: $successful_tests"
        echo "Failed/Unreachable: $((total_tests - successful_tests))"
        echo ""
        
        # Calculate success rate
        if [ $total_tests -gt 0 ]; then
          success_rate=$((successful_tests * 100 / total_tests))
          echo "Success Rate: $success_rate%"
          
          if [ $success_rate -ge 80 ]; then
            echo "🎉 EXCELLENT: API endpoints are responding well!"
            deployment_status="SUCCESS"
          elif [ $success_rate -ge 60 ]; then
            echo "⚠️ GOOD: Most API endpoints are working, some may need attention"
            deployment_status="PARTIAL"
          else
            echo "❌ POOR: Many endpoints are not responding correctly"
            deployment_status="ISSUES"
          fi
        fi
        
        echo ""
        echo "🔗 Quick Access URLs:"
        echo "Health Check: $BASE_URL/api/test/health"
        echo "API Documentation: $BASE_URL/swagger (if enabled)"
        echo "Recent Logs: $BASE_URL/api/logs/recent?lines=10"
        
        echo ""
        echo "🛠️ IIS TROUBLESHOOTING GUIDE"
        echo "=========================="
        if [ "$deployment_status" = "ISSUES" ] || [ "$deployment_status" = "PARTIAL" ]; then
          echo "❌ Some endpoints are not working. Common IIS issues:"
          echo ""
          echo "1. 📁 FILE DEPLOYMENT ISSUES:"
          echo "   - Check if all DLLs are deployed: stibe.api.dll, dependencies"
          echo "   - Verify web.config is present and correct"
          echo "   - Ensure appsettings.json and appsettings.Production.json exist"
          echo ""
          echo "2. 🔧 IIS CONFIGURATION:"
          echo "   - Application Pool: .NET CLR Version = 'No Managed Code'"
          echo "   - Application Pool: Managed Pipeline Mode = 'Integrated'"
          echo "   - Website: Physical Path = C:\\inetpub\\wwwroot\\test\\"
          echo "   - Bindings: Port 85, All Unassigned IP addresses"
          echo ""
          echo "3. 🚨 COMMON FIXES:"
          echo "   - Restart Application Pool in IIS Manager"
          echo "   - Check Windows Event Logs > Application"
          echo "   - Verify .NET 8.0 Runtime is installed"
          echo "   - Check file permissions (IIS_IUSRS needs read access)"
          echo ""
          echo "4. 🔍 DEBUGGING COMMANDS:"
          echo "   - Check app status: http://$BASE_URL/api/test/health"
          echo "   - View logs: http://$BASE_URL/api/logs/recent?lines=20"
          echo "   - IIS logs: C:\\inetpub\\logs\\LogFiles\\"
          echo ""
        else
          echo "✅ Deployment looks good! All critical endpoints are responding."
        fi
        
        # Set deployment result for workflow
        if [ "$deployment_status" = "SUCCESS" ]; then
          echo "DEPLOYMENT_RESULT=SUCCESS" >> $GITHUB_ENV
          exit 0
        elif [ "$deployment_status" = "PARTIAL" ]; then
          echo "DEPLOYMENT_RESULT=PARTIAL" >> $GITHUB_ENV
          exit 0
        else
          echo "DEPLOYMENT_RESULT=FAILED" >> $GITHUB_ENV
          exit 1
        fi
        
    - name: Deployment Summary
      if: always()
      run: |
        echo ""
        echo "📋 Deployment Summary"
        echo "===================="
        echo "🕒 Timestamp: $(date)"
        echo "📦 Package: .NET ${{ env.DOTNET_VERSION }} ${{ env.BUILD_CONFIGURATION }} Build"
        echo "🌐 Target: ${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
        echo "📁 Method: FTP Deployment to /test/"
        echo "🗄️ Database: ${MIGRATION_STATUS:-'Not specified'}"
        echo "🔍 Health Endpoint: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}${{ env.API_HEALTH_ENDPOINT }}"
        echo ""
        echo "ℹ️  Migration Info: ${MIGRATION_MESSAGE:-'No migration information available'}"
        echo ""
        echo "ℹ️  If health check fails, verify:"
        echo "   1. IIS Application Pool is running"
        echo "   2. Website bindings are correct (port ${{ env.REMOTE_PORT }})"
        echo "   3. .NET 8.0 Runtime is installed on server"
        echo "   4. Application pool is set to 'No Managed Code'"
        echo "   5. Check IIS logs and application event logs"
        echo "   6. Verify web.config is correctly deployed"
        echo "   7. Check if antivirus is blocking the application"
        echo ""
        echo "📁 Published files should be in: C:\\inetpub\\wwwroot\\test\\"
        echo "🔗 Access URL: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
