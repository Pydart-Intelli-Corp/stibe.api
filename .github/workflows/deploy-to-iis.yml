name: Deploy to Remote IIS Website

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  REMOTE_SERVER: '202.164.153.160'
  REMOTE_PORT: '85'
  FTP_PORT: '92'
  API_HEALTH_ENDPOINT: '/api/test/health'
  
jobs:
  deploy:
    runs-on: ubuntu-latest  # Use GitHub hosted runners
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build application
      run: dotnet build --configuration Release --no-restore
      
    - name: Run tests (if any)
      run: dotnet test --no-restore --verbosity normal --logger trx --results-directory "TestResults"
      continue-on-error: true
      
    - name: Install Entity Framework Tools
      run: dotnet tool install --global dotnet-ef
      
    - name: Update database with migrations
      run: |
        echo "🗄️ Updating database with latest migrations..."
        dotnet ef database update --verbose
      env:
        # Use production connection string from secrets or environment
        ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
      continue-on-error: false
      
    - name: Publish application
      run: dotnet publish --configuration Release --output ./publish --no-restore
      
    - name: Create deployment timestamp
      run: echo "DEPLOY_TIME=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
      
    - name: Deploy to IIS Website via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ env.REMOTE_SERVER }}
        port: ${{ env.FTP_PORT }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /test/  # Deploy to C:\inetpub\wwwroot\test directory
        protocol: ftp
        # Exclude unnecessary files
        exclude: |
          **/.git*
          **/.git*/**
          **/obj/**
          **/bin/Debug/**
          **/*.pdb
          **/appsettings.Development.json
        
    - name: Wait for IIS to restart
      run: |
        echo "⏳ Waiting for IIS application to restart and initialize..."
        sleep 30
        
    - name: Verify deployment and test API endpoints
      run: |
        echo "🔍 Testing API deployment on remote server..."
        
        # Health check endpoint
        echo "Testing health endpoint..."
        health_response=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}${{ env.API_HEALTH_ENDPOINT }}" || echo "000")
        
        # Root API endpoint
        echo "Testing root API endpoint..."
        root_response=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}/test/" || echo "000")
        
        echo ""
        echo "📊 Deployment Results:"
        echo "======================"
        
        if [ "$health_response" = "200" ]; then
          echo "✅ Health Check: SUCCESS (HTTP $health_response)"
          health_status="✅ HEALTHY"
        else
          echo "❌ Health Check: FAILED (HTTP $health_response)"
          health_status="❌ UNHEALTHY"
        fi
        
        if [ "$root_response" = "200" ] || [ "$root_response" = "404" ] || [ "$root_response" = "302" ]; then
          echo "✅ Root Endpoint: ACCESSIBLE (HTTP $root_response)"
          root_status="✅ ACCESSIBLE"
        else
          echo "❌ Root Endpoint: FAILED (HTTP $root_response)"
          root_status="❌ FAILED"
        fi
        
        echo ""
        echo "🌐 API Information:"
        echo "=================="
        echo "Server: ${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
        echo "Health Check: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}${{ env.API_HEALTH_ENDPOINT }}"
        echo "Deploy Time: ${{ env.DEPLOY_TIME }}"
        echo "Status: $health_status | Root: $root_status"
        
        # Set overall deployment status
        if [ "$health_response" = "200" ]; then
          echo ""
          echo "� DEPLOYMENT SUCCESSFUL!"
          echo "Your API is live and accessible at: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
          exit 0
        else
          echo ""
          echo "⚠️ DEPLOYMENT COMPLETED WITH ISSUES"
          echo "Files were deployed but API health check failed."
          echo "Please check your IIS application pool and website configuration."
          echo "Manual verification: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
          # Don't fail the build, as files were deployed successfully
          exit 0
        fi
        
    - name: Deployment Summary
      if: always()
      run: |
        echo ""
        echo "📋 Deployment Summary"
        echo "===================="
        echo "🕒 Timestamp: $(date)"
        echo "📦 Package: .NET 8.0 Release Build"
        echo "🌐 Target: ${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}"
        echo "📁 Method: FTP Deployment"
        echo "🔍 Health Endpoint: http://${{ env.REMOTE_SERVER }}:${{ env.REMOTE_PORT }}${{ env.API_HEALTH_ENDPOINT }}"
        echo ""
        echo "ℹ️  If health check fails, verify:"
        echo "   1. IIS Application Pool is running"
        echo "   2. Website bindings are correct (port ${{ env.REMOTE_PORT }})"
        echo "   3. .NET 8.0 Runtime is installed on server"
        echo "   4. Application pool is set to 'No Managed Code'"
