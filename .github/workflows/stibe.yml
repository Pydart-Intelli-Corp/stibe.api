name: Build and deploy .NET Core application to Web App stibe

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  AZURE_WEBAPP_NAME: stibe
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore packages
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Build application
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build --configuration ${{ env.CONFIGURATION }}

      - name: Publish application
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Create secrets directory
        run: mkdir -p config/secrets

      - name: Create secrets file for deployment
        run: |
          cat > config/secrets/appsettings.Secrets.json << 'EOF'
          {
            "ConnectionStrings": {
              "DefaultConnection": "${{ secrets.DB_CONNECTION_STRING }}"
            },
            "JwtSettings": {
              "SecretKey": "${{ secrets.JWT_SECRET_KEY }}"
            },
            "GoogleOAuth": {
              "ClientId": "${{ secrets.GOOGLE_CLIENT_ID }}",
              "ClientSecret": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
              "AndroidClientId": "${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}",
              "WebClientId": "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
            },
            "FileStorage": {
              "Azure": {
                "ConnectionString": "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}",
                "ContainerSasToken": "${{ secrets.AZURE_STORAGE_SAS_TOKEN }}",
                "BaseUrl": "${{ secrets.AZURE_STORAGE_BASE_URL }}"
              }
            },
            "SmtpSettings": {
              "Username": "${{ secrets.SMTP_USERNAME }}",
              "Password": "${{ secrets.SMTP_PASSWORD }}",
              "SenderEmail": "${{ secrets.SMTP_SENDER_EMAIL }}"
            },
            "Razorpay": {
              "KeyId": "${{ secrets.RAZORPAY_KEY_ID }}",
              "KeySecret": "${{ secrets.RAZORPAY_KEY_SECRET }}",
              "WebhookSecret": "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}",
              "CompanyLogo": "${{ secrets.RAZORPAY_COMPANY_LOGO }}"
            }
          }
          EOF

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Copy secrets to deployment package
        run: |
          mkdir -p ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/config/secrets
          cp config/secrets/appsettings.Secrets.json ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/config/secrets/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Set Environment Variable
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "ASPNETCORE_ENVIRONMENT",
                "value": "Production"
              }
            ]
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}