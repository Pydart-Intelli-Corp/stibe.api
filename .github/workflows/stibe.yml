name: Build and deploy .NET Core application to Web App stibe

on:
  push:
    branches:
      - master

env:
  AZURE_WEBAPP_NAME: stibe
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: .

jobs:
  build:
    runs-on: ubuntu-latest   # switched to Linux (faster, cheaper)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure App Service Configuration
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "FileStorage__Azure__ConnectionString",
                "value": "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "FileStorage__Azure__ContainerSasToken", 
                "value": "${{ secrets.AZURE_CONTAINER_SAS_TOKEN }}",
                "slotSetting": false
              },
              {
                "name": "ConnectionStrings__DefaultConnection",
                "value": "${{ secrets.DATABASE_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "JwtSettings__SecretKey",
                "value": "${{ secrets.JWT_SECRET_KEY }}",
                "slotSetting": false
              },
              {
                "name": "GoogleOAuth__ClientSecret",
                "value": "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}",
                "slotSetting": false
              },
              {
                "name": "SmtpSettings__Password",
                "value": "${{ secrets.SMTP_PASSWORD }}",
                "slotSetting": false
              },
              {
                "name": "Razorpay__KeySecret",
                "value": "${{ secrets.RAZORPAY_KEY_SECRET }}",
                "slotSetting": false
              },
              {
                "name": "Razorpay__WebhookSecret",
                "value": "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
