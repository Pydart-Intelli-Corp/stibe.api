name: Build and deploy .NET Core application to Web App stibe

on:
  push:
    branches:
      - master

env:
  AZURE_WEBAPP_NAME: stibe
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: .

jobs:
  build:
    runs-on: ubuntu-latest   # switched to Linux (faster, cheaper)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Replace secrets in appsettings.json
        run: |
          sed -i 's|#{ConnectionString}#|${{ secrets.CONNECTION_STRING }}|g' appsettings.json
          sed -i 's|#{JwtSecretKey}#|${{ secrets.JWT_SECRET_KEY }}|g' appsettings.json
          sed -i 's|#{GoogleClientId}#|${{ secrets.GOOGLE_CLIENT_ID }}|g' appsettings.json
          sed -i 's|#{GoogleClientSecret}#|${{ secrets.GOOGLE_CLIENT_SECRET }}|g' appsettings.json
          sed -i 's|#{GoogleAndroidClientId}#|${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}|g' appsettings.json
          sed -i 's|#{GoogleWebClientId}#|${{ secrets.GOOGLE_WEB_CLIENT_ID }}|g' appsettings.json
          sed -i 's|#{AzureStorageConnectionString}#|${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}|g' appsettings.json
          sed -i 's|#{AzureStorageSasToken}#|${{ secrets.AZURE_STORAGE_SAS_TOKEN }}|g' appsettings.json
          sed -i 's|#{SmtpUsername}#|${{ secrets.SMTP_USERNAME }}|g' appsettings.json
          sed -i 's|#{SmtpPassword}#|${{ secrets.SMTP_PASSWORD }}|g' appsettings.json
          sed -i 's|#{SmtpSenderEmail}#|${{ secrets.SMTP_SENDER_EMAIL }}|g' appsettings.json
          sed -i 's|#{RazorpayKeyId}#|${{ secrets.RAZORPAY_KEY_ID }}|g' appsettings.json
          sed -i 's|#{RazorpayKeySecret}#|${{ secrets.RAZORPAY_KEY_SECRET }}|g' appsettings.json
          sed -i 's|#{RazorpayWebhookSecret}#|${{ secrets.RAZORPAY_WEBHOOK_SECRET }}|g' appsettings.json

      - name: Replace secrets in appsettings.Production.json
        run: |
          sed -i 's|#{ConnectionString}#|${{ secrets.CONNECTION_STRING }}|g' appsettings.Production.json
          sed -i 's|#{JwtSecretKey}#|${{ secrets.JWT_SECRET_KEY }}|g' appsettings.Production.json
          sed -i 's|#{GoogleClientId}#|${{ secrets.GOOGLE_CLIENT_ID }}|g' appsettings.Production.json
          sed -i 's|#{GoogleClientSecret}#|${{ secrets.GOOGLE_CLIENT_SECRET }}|g' appsettings.Production.json
          sed -i 's|#{GoogleAndroidClientId}#|${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}|g' appsettings.Production.json
          sed -i 's|#{GoogleWebClientId}#|${{ secrets.GOOGLE_WEB_CLIENT_ID }}|g' appsettings.Production.json
          sed -i 's|#{AzureStorageConnectionString}#|${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}|g' appsettings.Production.json
          sed -i 's|#{AzureStorageSasToken}#|${{ secrets.AZURE_STORAGE_SAS_TOKEN }}|g' appsettings.Production.json
          sed -i 's|#{SmtpUsername}#|${{ secrets.SMTP_USERNAME }}|g' appsettings.Production.json
          sed -i 's|#{SmtpPassword}#|${{ secrets.SMTP_PASSWORD }}|g' appsettings.Production.json
          sed -i 's|#{SmtpSenderEmail}#|${{ secrets.SMTP_SENDER_EMAIL }}|g' appsettings.Production.json
          sed -i 's|#{RazorpayKeyId}#|${{ secrets.RAZORPAY_KEY_ID }}|g' appsettings.Production.json
          sed -i 's|#{RazorpayKeySecret}#|${{ secrets.RAZORPAY_KEY_SECRET }}|g' appsettings.Production.json
          sed -i 's|#{RazorpayWebhookSecret}#|${{ secrets.RAZORPAY_WEBHOOK_SECRET }}|g' appsettings.Production.json

      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
