<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stibe API - Live Logs</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
        }
        .header {
            background-color: #007acc;
            color: white;
            padding: 10px 20px;
            margin: -20px -20px 20px -20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            background-color: #2d2d30;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .controls button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-right: 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #005a9e;
        }
        .log-container {
            background-color: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 5px;
            height: 600px;
            overflow-y: auto;
            padding: 15px;
            font-size: 12px;
            line-height: 1.4;
        }
        .log-line {
            margin-bottom: 2px;
            word-wrap: break-word;
        }
        .log-error {
            color: #f48771;
            background-color: #3b1f1f;
            padding: 2px 4px;
        }
        .log-warning {
            color: #ddb74f;
            background-color: #3b3a1f;
            padding: 2px 4px;
        }
        .log-info {
            color: #9cdcfe;
        }
        .log-success {
            color: #4ec9b0;
        }
        .log-upload {
            color: #c586c0;
            background-color: #2d1f3b;
            padding: 2px 4px;
        }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 10px;
        }
        .status.connected {
            background-color: #4caf50;
            color: white;
        }
        .status.disconnected {
            background-color: #f44336;
            color: white;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .stat-card {
            background-color: #2d2d30;
            padding: 10px 15px;
            border-radius: 5px;
            min-width: 120px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #4ec9b0;
        }
        .stat-label {
            font-size: 11px;
            color: #858585;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Stibe API - Live Logs Monitor</h1>
        <div>
            <span id="serverTime">Loading...</span>
            <span id="connectionStatus" class="status disconnected">Disconnected</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalLogs">0</div>
            <div class="stat-label">Total Logs</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="errorCount">0</div>
            <div class="stat-label">Errors</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="uploadLogs">0</div>
            <div class="stat-label">Upload Logs</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="lastUpdate">Never</div>
            <div class="stat-label">Last Update</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="refreshLogs()">🔄 Refresh Logs</button>
        <button onclick="getProfileLogs()">🖼️ Profile Upload Logs</button>
        <button onclick="getSystemInfo()">ℹ️ System Info</button>
        <button onclick="clearLogs()">🗑️ Clear Display</button>
        <button onclick="toggleAutoRefresh()" id="autoRefreshBtn">▶️ Start Auto-Refresh</button>
        <select id="logLines" style="margin-left: 20px; padding: 6px;">
            <option value="50">50 lines</option>
            <option value="100" selected>100 lines</option>
            <option value="200">200 lines</option>
            <option value="500">500 lines</option>
        </select>
    </div>

    <div class="log-container" id="logContainer">
        <div class="log-line log-info">🚀 Stibe API Log Monitor Ready</div>
        <div class="log-line log-info">📡 Server: http://202.164.153.160:85</div>
        <div class="log-line log-info">⏰ Initialized at: <span id="initTime"></span></div>
        <div class="log-line log-warning">👆 Click "Refresh Logs" to load recent logs</div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let isAutoRefreshing = false;
        let totalLogCount = 0;
        let errorLogCount = 0;
        let uploadLogCount = 0;

        const API_BASE = 'http://202.164.153.160:85/api';

        document.getElementById('initTime').textContent = new Date().toLocaleString();
        updateServerTime();
        setInterval(updateServerTime, 1000);

        function updateServerTime() {
            document.getElementById('serverTime').textContent = new Date().toLocaleString();
        }

        function setConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = `status ${connected ? 'connected' : 'disconnected'}`;
            statusEl.textContent = connected ? 'Connected' : 'Disconnected';
        }

        function addLogLine(text, type = 'info') {
            const container = document.getElementById('logContainer');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            container.appendChild(line);
            container.scrollTop = container.scrollHeight;
            
            updateStats();
        }

        function updateStats() {
            const lines = document.querySelectorAll('.log-line');
            totalLogCount = lines.length;
            errorLogCount = document.querySelectorAll('.log-error').length;
            uploadLogCount = document.querySelectorAll('.log-upload').length;

            document.getElementById('totalLogs').textContent = totalLogCount;
            document.getElementById('errorCount').textContent = errorLogCount;
            document.getElementById('uploadLogs').textContent = uploadLogCount;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        function formatLogLine(logText) {
            if (logText.toLowerCase().includes('error') || logText.toLowerCase().includes('exception')) {
                return { text: logText, type: 'error' };
            } else if (logText.toLowerCase().includes('warning') || logText.toLowerCase().includes('warn')) {
                return { text: logText, type: 'warning' };
            } else if (logText.toLowerCase().includes('profile') && logText.toLowerCase().includes('image')) {
                return { text: logText, type: 'upload' };
            } else if (logText.toLowerCase().includes('success') || logText.includes('✅')) {
                return { text: logText, type: 'success' };
            } else {
                return { text: logText, type: 'info' };
            }
        }

        async function refreshLogs() {
            try {
                setConnectionStatus(true);
                const lines = document.getElementById('logLines').value;
                addLogLine(`📡 Fetching recent ${lines} logs...`, 'info');
                
                const response = await fetch(`${API_BASE}/logs/recent?lines=${lines}`);
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    addLogLine(`📄 Loaded ${data.logs.length} lines from ${data.logFile}`, 'success');
                    data.logs.forEach(log => {
                        const formatted = formatLogLine(log);
                        addLogLine(formatted.text, formatted.type);
                    });
                } else {
                    addLogLine('⚠️ No logs found', 'warning');
                }
            } catch (error) {
                setConnectionStatus(false);
                addLogLine(`❌ Error fetching logs: ${error.message}`, 'error');
            }
        }

        async function getProfileLogs() {
            try {
                setConnectionStatus(true);
                addLogLine('🖼️ Fetching profile upload logs...', 'info');
                
                const response = await fetch(`${API_BASE}/logs/profile-upload?lines=30`);
                const data = await response.json();
                
                addLogLine(`📋 ${data.message}`, 'info');
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(log => {
                        addLogLine(log, 'upload');
                    });
                } else {
                    addLogLine('ℹ️ No profile upload logs found', 'info');
                }
            } catch (error) {
                setConnectionStatus(false);
                addLogLine(`❌ Error fetching profile logs: ${error.message}`, 'error');
            }
        }

        async function getSystemInfo() {
            try {
                setConnectionStatus(true);
                addLogLine('💻 Fetching system information...', 'info');
                
                const response = await fetch(`${API_BASE}/logs/system-info`);
                const data = await response.json();
                
                addLogLine(`🕐 Server Time: ${data.serverTime}`, 'info');
                addLogLine(`🌍 Environment: ${data.environment}`, 'info');
                addLogLine(`📁 Content Root: ${data.contentRootPath}`, 'info');
                addLogLine(`🌐 Web Root: ${data.webRootPath || 'Not set'}`, 'info');
                addLogLine(`📊 Process ID: ${data.processInfo.processId}`, 'info');
                addLogLine(`💾 Working Set: ${Math.round(data.processInfo.workingSet / 1024 / 1024)} MB`, 'info');
                
                if (data.diskSpace && Array.isArray(data.diskSpace)) {
                    data.diskSpace.forEach(drive => {
                        addLogLine(`💽 Drive ${drive.name}: ${drive.freeSpaceGB} GB free of ${drive.totalSizeGB} GB`, 'info');
                    });
                }
                
                addLogLine(`📂 Directories - Logs: ${data.directories.logs ? '✅' : '❌'}, WWWRoot: ${data.directories.wwwroot ? '✅' : '❌'}, Uploads: ${data.directories.uploads ? '✅' : '❌'}`, 'info');
                
            } catch (error) {
                setConnectionStatus(false);
                addLogLine(`❌ Error fetching system info: ${error.message}`, 'error');
            }
        }

        function clearLogs() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '<div class="log-line log-info">🧹 Logs cleared</div>';
            totalLogCount = 0;
            errorLogCount = 0;
            uploadLogCount = 0;
            updateStats();
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            
            if (isAutoRefreshing) {
                clearInterval(autoRefreshInterval);
                btn.textContent = '▶️ Start Auto-Refresh';
                btn.style.backgroundColor = '#007acc';
                isAutoRefreshing = false;
                addLogLine('⏹️ Auto-refresh stopped', 'warning');
            } else {
                autoRefreshInterval = setInterval(refreshLogs, 5000);
                btn.textContent = '⏸️ Stop Auto-Refresh';
                btn.style.backgroundColor = '#d73a49';
                isAutoRefreshing = true;
                addLogLine('🔄 Auto-refresh started (every 5 seconds)', 'success');
                refreshLogs(); // Initial load
            }
        }

        // Test API connection on load
        setTimeout(async () => {
            try {
                const response = await fetch(`${API_BASE}/logs/system-info`);
                if (response.ok) {
                    addLogLine('✅ API connection established', 'success');
                    setConnectionStatus(true);
                } else {
                    addLogLine('⚠️ API responded with error status', 'warning');
                }
            } catch (error) {
                addLogLine('❌ Cannot connect to API', 'error');
                setConnectionStatus(false);
            }
        }, 1000);
    </script>
</body>
</html>
